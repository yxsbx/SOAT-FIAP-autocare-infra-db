name: Database Infrastructure CI/CD

on:
  push:
    branches: [fase-3, homolog, main]
  pull_request:
    branches: [fase-3, homolog, main]
  workflow_dispatch:

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform validate
        run: |
          terraform init -backend=false
          terraform validate

  deploy:
    if: github.event_name == 'push' && (github.ref_name == 'homolog' || github.ref_name == 'main')
    needs: terraform-validate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    defaults:
      run:
        working-directory: terraform
    env:
      TF_ENV: ${{ github.ref_name == 'main' && 'prod' || 'hml' }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || 'hml' }}
      TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
      TF_VAR_private_subnet_ids: ${{ secrets.PRIVATE_SUBNET_IDS_JSON }}
      TF_VAR_allowed_security_group_ids: ${{ secrets.ALLOWED_SECURITY_GROUP_IDS_JSON }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform plan
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=autocarehub-db/${{ env.TF_ENV }}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"
          terraform plan -input=false
      - name: Terraform apply
        run: terraform apply -auto-approve -input=false
